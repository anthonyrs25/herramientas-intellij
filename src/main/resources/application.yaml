server:
  port: 8081
  error:
    include-message: always

spring:
  application:
    name: herramientas-intellij

  datasource:
    url: jdbc:postgresql://localhost:5432/herramientasintellij
    username: postgres
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true